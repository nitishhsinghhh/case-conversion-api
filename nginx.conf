# Description :
# NGINX Reverse Proxy & Layer 7 Load Balancer configuration for the
# Polyglot Case Conversion API platform.
#
# This configuration provides:
#   - Reverse proxy routing
#   - Layer 7 load balancing
#   - Connection keepalive optimization
#   - Native bridge timeout standardization
#   - Health-check endpoint exposure
#   - Low-latency proxy orchestration
#
# Architectural Notes:
#   - Least Connections balancing is used to distribute workloads
#     evenly across backend .NET replicas when native C++ execution
#     time varies due to payload size and transformation complexity.
#
#   - Persistent keepalive connections reduce TCP handshake overhead
#     during high-concurrency stress testing workloads.
#
#   - Proxy buffering is intentionally disabled to minimize latency
#     for small string transformation payloads.
#
# Target Environment:
#   - Docker Compose
#   - ASP.NET Core (.NET 8)
#   - Native C++17 Processing Engine
#   - ARM64 / Apple Silicon Optimized
#
# Change History (Reverse Chronological):
# -----------------------------------------------------------------------------
# 2.0 | 2026-05-18 | Nitish Singh | Added enterprise-grade documentation,
#                                   timeout standardization, and keepalive
#                                   tuning for sustained concurrency.
#
# 1.0 | 2026-04-20 | Nitish Singh | Initial reverse proxy and load balancer
#                                   configuration.
# -----------------------------------------------------------------------------

events {
    worker_connections 4096;
}

http {

    # -------------------------------------------------------------------------
    # Upstream Backend Pool
    # -------------------------------------------------------------------------
    # The upstream block defines the backend .NET API replicas participating
    # in load balancing orchestration.
    # -------------------------------------------------------------------------
    upstream backend_servers {

        # Load-aware balancing strategy optimized for variable native workloads.
        least_conn;

        # Docker DNS resolves 'backend' to all active backend replicas.
        server backend:8080;

        # Persistent backend connection pool.
        keepalive 32;
    }

    server {

        # ---------------------------------------------------------------------
        # Public HTTP Listener
        # ---------------------------------------------------------------------
        listen 80;

        # ---------------------------------------------------------------------
        # Proxy Timeout Standardization
        # ---------------------------------------------------------------------
        # Stabilizes request handling during native execution and prevents
        # stalled connections under sustained concurrency.
        # ---------------------------------------------------------------------
        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;

        # ---------------------------------------------------------------------
        # API Reverse Proxy
        # ---------------------------------------------------------------------
        location / {

            proxy_pass http://backend_servers;

            # HTTP/1.1 required for persistent keepalive connections.
            proxy_http_version 1.1;

            # Enables backend connection reuse.
            proxy_set_header Connection "";

            # Forward original request metadata.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable response buffering for low-latency payload streaming.
            proxy_buffering off;
        }

        # ---------------------------------------------------------------------
        # Health Check Endpoint
        # ---------------------------------------------------------------------
        # Used by Docker Compose and orchestration systems to verify
        # container responsiveness.
        # ---------------------------------------------------------------------
        location /health {

            access_log off;

            return 200 'OK';
        }
    }
}