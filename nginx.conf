# -----------------------------------------------------------------------------
# Nginx Reverse Proxy & Load Balancer Configuration
# -----------------------------------------------------------------------------
# CONFIGURATION:
# * Upstream: Points to 'backend:8080'
# * Protocol: Listens on Port 80
# -----------------------------------------------------------------------------

events { 
    worker_connections 4096; 
}

http {
    upstream backend_servers {
        # 'least_conn' is better for native engines where processing time 
        # may vary slightly based on string complexity.
        least_conn;
        
        # Ensure this port matches your .NET Kestrel configuration (e.g., 5050 or 8080)
        server backend:8080;

        # Keepalive prevents the "TCP Handshake Storm" during your 300k test
        keepalive 32;
    }

    server {
        listen 80;

        # Standardizing timeouts for native bridge stability
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;

        location / {
            proxy_pass http://backend_servers;
            
            # Use HTTP 1.1 to support keepalive connections to the backend
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Buffering off reduces latency for small conversion payloads
            proxy_buffering off;
        }

        # Health check endpoint for the Docker Compose healthcheck
        location /health {
            access_log off;
            return 200 'OK';
        }
    }
}