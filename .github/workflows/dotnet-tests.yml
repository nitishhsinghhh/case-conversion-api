name: ".NET Tests"

on:
  push:
    branches: ["main", "develop"]
    paths: &shared_paths
      - 'Backend/CaseConversionAPI/CppLib/**'
      - 'Backend/CaseConversionAPI/DotNetAPI/**'
      - 'Backend/CaseConversionAPI/Tests/DotNetTests/**' # <-- FIXED: tests to Tests
      - '.github/workflows/dotnet-tests.yml'
  pull_request:
    branches: ["main"]
    paths: *shared_paths

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    # Orchestrate Jaeger sidecar for Linux to verify trace ingestion
    services:
      jaeger:
        image: ${{ matrix.os == 'ubuntu-latest' && 'jaegertracing/all-in-one:latest' || '' }}
        env:
          COLLECTOR_OTLP_ENABLED: true
        ports:
          - 4317:4317

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Structured Logging
      # ------------------------------------------------------------

      - name: Initialize Workflow Logs
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          log_event() {
            jq -n \
              --arg ts "$TIMESTAMP" \
              --arg os "${{ matrix.os }}" \
              --arg lvl "$1" \
              --arg msg "$2" \
              '{timestamp: $ts, runner_os: $os, level: $lvl, component: "telemetry-validator", message: $msg}' -c
          }
          log_event "INFO" "Starting Multi-Platform .NET Integration suite"

      - name: Setup .NET Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ------------------------------------------------------------
      # Native Layer Build (C++17)
      # ------------------------------------------------------------

      - name: Build C++ Library (Unix)
        if: runner.os != 'Windows'
        working-directory: Backend/CaseConversionAPI/CppLib
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Build C++ Library (Windows)
        if: runner.os == 'Windows'
        working-directory: Backend/CaseConversionAPI/CppLib
        run: |
          cmake -S . -B build `
                -DCMAKE_BUILD_TYPE=Release `
                -DPROCESSSTRING_EXPORTS=ON `
                -D_CRT_SECURE_NO_WARNINGS=ON `
                -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # Managed Layer Build & ABI Bridge Preparation
      # ------------------------------------------------------------

      - name: Build .NET Tests
        working-directory: Backend/CaseConversionAPI/Tests/DotNetTests # <-- FIXED: tests to Tests
        run: |
          dotnet restore
          dotnet build --configuration Release

      - name: Inject Native Library (Artifact Injection)
        shell: bash
        run: |
          DEST_PATH="Backend/CaseConversionAPI/Tests/DotNetTests/bin/Release/net8.0/" # <-- FIXED: tests to Tests
          mkdir -p "$DEST_PATH"

          if [ "${{ runner.os }}" == "Windows" ]; then
            LIB_FILE=$(find Backend/CaseConversionAPI/CppLib/build -name "*.dll" | head -n 1)
            TARGET_NAME="ProcessStringDLL.dll"
          elif [ "${{ runner.os }}" == "macOS" ]; then # <-- FIXED: Match exact runner token context
            LIB_FILE=$(find Backend/CaseConversionAPI/CppLib/build -name "*.dylib" | head -n 1)
            TARGET_NAME="libProcessStringDLL.dylib"
          else
            LIB_FILE=$(find Backend/CaseConversionAPI/CppLib/build -name "*.so" | head -n 1)
            TARGET_NAME="libProcessStringDLL.so"
          fi

          cp "$LIB_FILE" "$DEST_PATH$TARGET_NAME"
          cp "$LIB_FILE" "Backend/CaseConversionAPI/Tests/DotNetTests/$TARGET_NAME" # <-- FIXED: tests to Tests
          
          echo "{\"event\": \"BRIDGE_READY\", \"lib\": \"$TARGET_NAME\", \"os\": \"${{ matrix.os }}\"}"

      # ------------------------------------------------------------
      # Test Execution (With Telemetry Context)
      # ------------------------------------------------------------
        
      - name: Run Integration Tests
        working-directory: Backend/CaseConversionAPI/Tests/DotNetTests # <-- FIXED: tests to Tests
        shell: bash
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ runner.os == 'Linux' && 'http://localhost:4317' || 'http://localhost:9999' }}
          OTEL_SERVICE_NAME: "CaseConversion-Test-Runner"
          # Injects context boundaries for the macOS runtime dynamic loader index
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/Backend/CaseConversionAPI/Tests/DotNetTests
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            export PATH="$PATH:$(pwd)"
          fi
          dotnet test --no-build --configuration Release --verbosity normal

      - name: Finalize Status
        if: always()
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg st "${{ job.status }}" \
            '{timestamp: $ts, event: "TELEMETRY_SUITE_COMPLETE", status: $st}' -c