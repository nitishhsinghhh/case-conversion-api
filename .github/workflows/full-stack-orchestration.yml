# DESCRIPTION : Orchestrates multi-platform builds and automates     */
#               Docker distribution to GitHub Packages (GHCR).       */
#               Synchronizes native binary artifacts with the .NET   */
#               managed layer for immutable container versioning.    */
#                                                                    */
# SIDE EFFECTS: Publishes images to GHCR. Triggers parallel matrix   */
#               execution across Linux, Windows, and macOS.          */
