name: "Full Stack Build & Container Publish"

on:
  push:
    branches: ["main"]
    paths: &shared_paths
      - 'Backend/CaseConversionAPI/CppLib/**'
      - 'Backend/CaseConversionAPI/DotNetAPI/**'
      - '.github/workflows/full-stack-orchestration.yml'
  pull_request:
    branches: ["main"]
    paths: *shared_paths

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------
  # JOB 1: NATIVE ENGINE & MANAGED API (ABI BRIDGE)
  # ------------------------------------------------------------

  build-dll-api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Initialize Workflow Logs
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg os "${{ matrix.os }}" \
            '{timestamp: $ts, event: "COMPILATION_START", runner: $os, layer: "polyglot-bridge"}' -c

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1.14
        with:
          cmake-version: '3.26.4'

      - name: Install compiler (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Native Layer (C++17)
      - name: Configure DLL (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -S Backend/CaseConversionAPI/CppLib \
                -B Backend/CaseConversionAPI/CppLib/build_dll \
                -DCMAKE_BUILD_TYPE=Release

      - name: Configure DLL (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S Backend/CaseConversionAPI/CppLib `
                -B Backend/CaseConversionAPI/CppLib/build_dll `
                -DCMAKE_BUILD_TYPE=Release `
                -DPROCESSSTRING_EXPORTS=ON `
                -G "Visual Studio 17 2022" -A x64

      - name: Build DLL
        run: cmake --build Backend/CaseConversionAPI/CppLib/build_dll --config Release --parallel

      # Managed Layer (.NET 8)
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Publish .NET API
        run: |
          dotnet restore Backend/CaseConversionAPI/DotNetAPI
          dotnet publish Backend/CaseConversionAPI/DotNetAPI -c Release -o ./publish

      # ABI Bridge (Artifact Injection)
      - name: Inject Native Artifacts
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            cp Backend/CaseConversionAPI/CppLib/build_dll/libProcessStringDLL.so ./publish/
          elif [ "${{ runner.os }}" == "macOS" ]; then
            cp Backend/CaseConversionAPI/CppLib/build_dll/libProcessStringDLL.dylib ./publish/
          elif [ "${{ runner.os }}" == "Windows" ]; then
            find Backend/CaseConversionAPI/CppLib/build_dll -name "ProcessStringDLL.dll" -exec cp {} ./publish/ \;
          fi
          echo "{\"event\": \"ABI_SYNC_COMPLETE\", \"os\": \"${{ matrix.os }}\"}"

      - name: Upload API + DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotNetAPI-${{ matrix.os }}
          path: ./publish/

  # ------------------------------------------------------------
  # JOB 2: FRONTEND VALIDATION
  # ------------------------------------------------------------

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
      - name: Build Frontend
        working-directory: ./Frontend
        run: |
          npm install
          npm run build
      - name: Upload Frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: Frontend-Static-Assets
          path: frontend/dist/

  # ------------------------------------------------------------
  # JOB 3: DOCKER DISTRIBUTION (GHCR)
  # ------------------------------------------------------------
    
  publish-docker:
    needs: [build-dll-api]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: DotNetAPI-ubuntu-latest
          path: ./publish

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and Push to Packages
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/nitishhsinghhh/case-conversion-api:latest
            ghcr.io/nitishhsinghhh/case-conversion-api:v3.0.0
            ghcr.io/nitishhsinghhh/case-conversion-api:${{ github.sha }}

      - name: Finalize Status
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg st "${{ job.status }}" \
            '{timestamp: $ts, event: "DOCKER_GHCR_PUBLISH", status: $st}' -c