#*********************************************************************/
#  CI Pipeline - Telemetry E2E Integration & Verification            */
#                                                                    */
# Purpose   : Orchestrates a full-stack smoke test by building the   */
#             C++ engine, running the .NET API, and verifying        */
#             trace ingestion into a live Jaeger instance.           */
# Trigger   : Push to main / Pull Request to main                    */
# Runtime   : Ubuntu Latest (GitHub Hosted)                          */
#                                                                    */
# Notes     : - Validates cross-language Span propagation.           */
#             - Requires Jaeger sidecar with OTLP enabled.           */
#             - v1.1: Standardized paths and added graceful flush.   */
#                                                                    */
# Revision History:                                                  */
# ------------------------------------------------------------------ */
# Version    Date        Author          Description                 */
# ------------------------------------------------------------------ */
# 1.0        2026-04-18  Nitish Singh    Initial E2E Telemetry CI    */
# 1.1        2026-04-24  Nitish Singh    Standardized Header & Paths */
#*********************************************************************/

name: "Telemetry E2E Verification"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  telemetry-test:
    name: "Build, Instrument, and Verify"
    runs-on: ubuntu-latest

    # Sidecar Services: Jaeger OTLP collector
    services:
      jaeger:
        image: jaegertracing/all-in-one:latest
        env:
          COLLECTOR_OTLP_ENABLED: true
        ports:
          - 16686:16686
          - 4317:4317

    steps:
      # --- 1. Environment Setup ---
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      # --- 2. Build Native Layer ---
      - name: Compile C++ Conversion Engine
        run: |
          mkdir -p backend/CaseConversionAPI/CppLib/build
          cd backend/CaseConversionAPI/CppLib/build
          cmake ..
          make

     # --- 3. Build & Launch Managed Gateway ---
      - name: Bootstrap .NET API
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          ASPNETCORE_URLS: http://localhost:5050 
          ASPNETCORE_ENVIRONMENT: Development
          LD_LIBRARY_PATH: .:${{ github.workspace }}/backend/CaseConversionAPI/CppLib/build
        run: |
          cd backend/CaseConversionAPI/DotNetAPI
          dotnet build -c Release
          
          cp ../CppLib/build/libProcessStringDLL.so .
          cp ../CppLib/build/libProcessStringDLL.so ./bin/Release/net8.0/
          
          dotnet ./bin/Release/net8.0/DotNetAPI.dll > api.log 2>&1 & 
          
          echo "Waiting for API to respond..."
          # Update the URL here to 5050
          timeout 60s bash -c 'until curl -sf http://localhost:5050/api/WordCase/convert \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"text\":\"CI-PROBE\", \"choice\":1}"; do 
              echo "Waiting for Kestrel and Native Engine..."; 
              sleep 2; 
            done' || (echo "FATAL: API failed to start. Logs:" && cat api.log && exit 1)

      # --- 4. Traffic Injection ---
      - name: Trigger Distributed Trace
        run: |
          for i in {1..3}; do
            # Update the URL here to 5050
            curl -v -X POST http://localhost:5050/api/WordCase/convert \
            -H "Content-Type: application/json" \
            -d '{"text": "E2E-PROBE-'$i'", "choice": 1}'
            sleep 1
          done

      # --- 5. Telemetry Validation ---
      - name: Verify Span Ingestion in Jaeger
        run: |
          echo "Sending SIGTERM to flush OTLP buffers..."
          pkill -15 dotnet
          sleep 7 # Give Jaeger time to index the incoming OTLP data

          echo "Querying Jaeger API..."
          for i in {1..12}; do
            # We look for the specific span name generated by your C++ bridge
            RESPONSE=$(curl -s "http://localhost:16686/api/traces?service=CaseConversion-Gateway")
            
            if [[ "$RESPONSE" == *"Native-C++-Process"* ]]; then
              echo "SUCCESS: Cross-language Trace detected!"
              exit 0
            fi
            
            echo "Attempt $i: Span not indexed yet. Retrying..."
            sleep 5
          done
          
          echo "ERROR: Trace verification timed out."
          cat backend/CaseConversionAPI/DotNetAPI/api.log
          exit 1

      - name: Debug API Crash
        if: failure()
        run: |
          echo "--- API LOG OUTPUT ---"
          cat backend/CaseConversionAPI/DotNetAPI/api.log
          echo "--- LDD CHECK (Dependency verification) ---"
          ldd backend/CaseConversionAPI/CppLib/build/libProcessStringDLL.so