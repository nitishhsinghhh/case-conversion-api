name: "Telemetry E2E Verification"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  telemetry-test:
    name: "Build, Instrument, and Verify"
    runs-on: ubuntu-latest

    services:
      jaeger:
        image: jaegertracing/all-in-one:latest
        env:
          COLLECTOR_OTLP_ENABLED: true
        ports:
          - 16686:16686
          - 4317:4317

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization
      # ------------------------------------------------------------
        
      - name: Initialize Workflow Logs
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"TELEMETRY_E2E_START\"}"

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0

      # ------------------------------------------------------------
      # Native Layer Build (C++17 Engine)
      # ------------------------------------------------------------

      - name: Compile C++ Conversion Engine
        run: |
          cmake -S Backend/CaseConversionAPI/CppLib -B Backend/CaseConversionAPI/CppLib/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Backend/CaseConversionAPI/CppLib/build --parallel

      # ------------------------------------------------------------
      # Managed Layer & Sidecar Orchestration
      # ------------------------------------------------------------

      - name: Bootstrap .NET API
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          ASPNETCORE_URLS: http://localhost:5050 
          ASPNETCORE_ENVIRONMENT: Development
          LD_LIBRARY_PATH: .:${{ github.workspace }}/Backend/CaseConversionAPI/CppLib/build
        run: |
          cd Backend/CaseConversionAPI/DotNetAPI
          dotnet build -c Release
          
          # Synchronize Native Binary with API Runtime
          cp ../CppLib/build/libProcessStringDLL.so .
          cp ../CppLib/build/libProcessStringDLL.so ./bin/Release/net8.0/
          
          # Background Execution for Trace Capture
          dotnet ./bin/Release/net8.0/DotNetAPI.dll > api.log 2>&1 & 
          
          echo "Waiting for API Readiness at :5050..."
          timeout 60s bash -c 'until curl -sf http://localhost:5050/api/WordCase/convert \
            -X POST -H "Content-Type: application/json" \
            -d "{\"text\":\"CI-PROBE\", \"choice\":1}"; do 
              sleep 2; 
            done' || (echo "FATAL: API Startup Timeout" && cat api.log && exit 1)

      # ------------------------------------------------------------
      # Traffic Injection & Span Generation
      # ------------------------------------------------------------

      - name: Trigger Distributed Trace
        run: |
          for i in {1..3}; do
            curl -v -X POST http://localhost:5050/api/WordCase/convert \
            -H "Content-Type: application/json" \
            -d '{"text": "E2E-PROBE-'$i'", "choice": 1}'
            sleep 1
          done

      # ------------------------------------------------------------
      # Telemetry Governance & Verification
      # ------------------------------------------------------------

      - name: Verify Span Ingestion in Jaeger
        run: |
          echo "{\"event\": \"TELEMETRY_FLUSH\", \"action\": \"SIGTERM\"}"
          pkill -15 dotnet
          sleep 7 # Buffer for Jaeger indexing

          for i in {1..12}; do
            RESPONSE=$(curl -s "http://localhost:16686/api/traces?service=CaseConversion-Gateway")
            
            if [[ "$RESPONSE" == *"Native-C++-Process"* ]]; then
              echo "{\"event\": \"TRACE_VALIDATION_SUCCESS\", \"provider\": \"Jaeger\"}"
              exit 0
            fi
            
            echo "Attempt $i: Trace not indexed. Retrying..."
            sleep 5
          done
          
          echo "{\"event\": \"TRACE_VALIDATION_TIMEOUT\"}"
          cat Backend/CaseConversionAPI/DotNetAPI/api.log
          exit 1

      - name: Finalize Status
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"TELEMETRY_E2E_COMPLETE\", \"status\": \"${{ job.status }}\"}"