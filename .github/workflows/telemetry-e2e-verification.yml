# DESCRIPTION : Orchestrates a full-stack smoke test by building the */
#               C++ engine, running the .NET API, and verifying      */
#               trace ingestion into a live Jaeger instance.         */
#                                                                    */
# SIDE EFFECTS: Validates cross-language Span propagation. Requires  */
#               Jaeger sidecar with OTLP enabled. Flushes buffers    */
#               via SIGTERM for accurate trace indexing.             */
