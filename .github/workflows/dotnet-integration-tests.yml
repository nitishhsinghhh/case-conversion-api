name: ".NET Integration Tests"

on:
  push:
    branches: ["main"]
    paths: &shared_paths
      - 'Backend/CaseConversionAPI/CppLib/**'
      - 'Backend/CaseConversionAPI/DotNetAPI/**'
      - 'Backend/CaseConversionAPI/tests/DotNetTests/**'
      - '.github/workflows/dotnet-integration-tests.yml'
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: ["main"]
    paths: *shared_paths
    paths-ignore:
      - '**/*.md'

env:
  CPP_LIB_DIR: "Backend/CaseConversionAPI/CppLib"
  DOTNET_TEST_DIR: "Backend/CaseConversionAPI/tests/DotNetTests"
  DOTNET_BIN_REL: "Backend/CaseConversionAPI/DotNetAPI/bin/Release/net8.0"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_ext: "*.so"
            target_name: "libProcessStringDLL.so"
          - os: macos-latest
            lib_ext: "*.dylib"
            target_name: "libProcessStringDLL.dylib"
          - os: windows-latest
            lib_ext: "*.dll"
            target_name: "libProcessStringDLL.dll"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Structured Logging
      # ------------------------------------------------------------
      
      - name: Initialize Workflow Logs
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          log_event() {
            jq -n \
              --arg ts "$TIMESTAMP" \
              --arg os "${{ matrix.os }}" \
              --arg lvl "$1" \
              --arg msg "$2" \
              '{timestamp: $ts, runner_os: $os, level: $lvl, component: "integration-tests", message: $msg}' -c
          }
          log_event "INFO" "Initializing Multi-Platform Test Matrix"

      - name: Setup .NET Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      # ------------------------------------------------------------
      # Native Layer Build (C++17)
      # ------------------------------------------------------------

      - name: Build C++ Library (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.CPP_LIB_DIR }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Build C++ Library (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.CPP_LIB_DIR }}
        run: |
          cmake -S . -B build `
                -DCMAKE_BUILD_TYPE=Release `
                -DPROCESSSTRING_EXPORTS=ON `
                -D_CRT_SECURE_NO_WARNINGS=ON `
                -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # Managed Layer Build & ABI Bridge Injection
      # ------------------------------------------------------------

      - name: Build .NET Tests
        working-directory: ${{ env.DOTNET_TEST_DIR }}
        run: |
          dotnet restore
          dotnet build --configuration Release

      - name: Inject Native Library (ABI Bridge)
        shell: bash
        run: |
          FULL_DEST="${{ env.DOTNET_TEST_DIR }}/${{ env.DOTNET_BIN_REL }}/"
          mkdir -p "$FULL_DEST"
          
          # Find and inject OS-specific binary
          LIB_FILE=$(find ${{ env.CPP_LIB_DIR }} -name "${{ matrix.lib_ext }}" | head -n 1)
          TARGET_NAME=${{ matrix.target_name }}
          
          cp "$LIB_FILE" "$FULL_DEST$TARGET_NAME"
          cp "$LIB_FILE" "${{ env.DOTNET_TEST_DIR }}/$TARGET_NAME"
          
          echo "{\"event\": \"ARTIFACT_INJECTION\", \"source\": \"$LIB_FILE\", \"target\": \"$TARGET_NAME\"}"

      # ------------------------------------------------------------
      # Test Execution & Telemetry
      # ------------------------------------------------------------
        
      - name: Run Integration Tests
        working-directory: ${{ env.DOTNET_TEST_DIR }}
        shell: bash
        env:
          OTEL_SERVICE_NAME: "CaseConversion-Test-Runner"
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            export PATH="$PATH:$(pwd)"
          fi
          dotnet test --no-build --configuration Release --verbosity normal

      - name: Finalize Status
        if: always()
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg st "${{ job.status }}" \
            '{timestamp: $ts, event: "PLATFORM_TEST_COMPLETE", status: $st}' -c