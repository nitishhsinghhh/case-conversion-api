#*********************************************************************/
#  CI Pipeline - .NET + API Integration Tests (Multi-Platform)       */
#                                                                    */
# Purpose   : Validates the P/Invoke bridge and API logic across     */
#              Ubuntu, macOS, and Windows environments.              */
# Trigger   : Push to main/develop | Pull Request to main            */
# Runtime   : Matrix (Ubuntu, macOS, Windows)                        */
#                                                                    */
# Notes     : - Synchronizes Native & Managed build cycles.          */
#             - Implements cross-platform artifact injection.        */
#             - Fixes Windows C2491 via PROCESSSTRING_EXPORTS.       */
#                                                                    */
# Revision History:                                                  */
# ------------------------------------------------------------------ */
# Version    Date        Author          Description                 */
# ------------------------------------------------------------------ */
# 1.0        2026-04-14  Nitish Singh    Initial .NET Integration CI */
# 1.1        2026-04-15  Nitish Singh    Updated for /backend path   */
# 1.2        2026-04-17  Nitish Singh    Multi-Platform Matrix Fix   */
# 1.3        2026-04-24  Nitish Singh    Standardized Header & Env   */
# 1.4        2026-05-01  Nitish Singh    Added path filters          */
# 1.5        2026-05-07  Nitish Singh    Path Var Hoisting & Cleanup */
# 1.6        2026-05-07  Nitish Singh    DllNotFound Path Fix        */
#*********************************************************************/

name: ".NET Integration Tests"

on:
  push:
    branches: [ "main" ]
    paths: &shared_paths
      - 'backend/CaseConversionAPI/CppLib/**'
      - 'backend/CaseConversionAPI/DotNetAPI/**'       # Main API Project
      - 'backend/CaseConversionAPI/tests/DotNetTests/**'
      - '.github/workflows/dotnet-integration-tests.yml' # Trigger on workflow changes
  pull_request:
    branches: [ "main" ]
    paths: *shared_paths

# Single Source of Truth for Path Management
env:
  CPP_LIB_DIR: "backend/CaseConversionAPI/CppLib"
  DOTNET_TEST_DIR: "backend/CaseConversionAPI/tests/DotNetTests"
  DOTNET_BIN_REL: "bin/Release/net8.0"

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lib_ext: "*.so"
            target_name: "libProcessStringDLL.so"
          - os: macos-latest
            lib_ext: "*.dylib"
            target_name: "libProcessStringDLL.dylib"
          - os: windows-latest
            lib_ext: "*.dll"
            target_name: "libProcessStringDLL.dll"
    runs-on: ${{ matrix.os }}

    steps:
      # ======================================================
      # 1. ENVIRONMENT SETUP
      # ======================================================

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }} 
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ======================================================
      # 2. NATIVE LAYER BUILD (C++17)
      # ======================================================

      - name: Build C++ Library (Unix)
        if: runner.os != 'Windows'
        working-directory: ${{ env.CPP_LIB_DIR }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      - name: Build C++ Library (Windows)
        if: runner.os == 'Windows'
        working-directory: ${{ env.CPP_LIB_DIR }}
        run: |
          cmake -S . -B build `
                -DCMAKE_BUILD_TYPE=Release `
                -DPROCESSSTRING_EXPORTS=ON `
                -D_CRT_SECURE_NO_WARNINGS=ON `
                -G "Visual Studio 17 2022" -A x64
          cmake --build build --config Release --parallel

      # ======================================================
      # 3. MANAGED LAYER BUILD (.NET 8)
      # ======================================================
      - name: Build .NET Tests
        working-directory: ${{ env.DOTNET_TEST_DIR }}
        run: |
          dotnet restore
          dotnet build --configuration Release

      # ======================================================
      # 4. ARTIFACT INJECTION (ABI BRIDGE PREP)
      # ======================================================

      - name: Inject Native Library
        shell: bash
        run: |
          FULL_DEST="${{ env.DOTNET_TEST_DIR }}/${{ env.DOTNET_BIN_REL }}/"
          mkdir -p "$FULL_DEST"

            if [ "${{ runner.os }}" == "Windows" ]; then
              LIB_FILE=$(find ${{ env.CPP_LIB_DIR }} -name "*.dll" | head -n 1)
              TARGET_NAME=${{ matrix.target_name }}
            elif [ "${{ runner.os }}" == "macOS" ]; then
              LIB_FILE=$(find ${{ env.CPP_LIB_DIR }} -name "*.dylib" | head -n 1)
              TARGET_NAME=${{ matrix.target_name }}
            else
              LIB_FILE=$(find ${{ env.CPP_LIB_DIR }} -name "*.so" | head -n 1)
              TARGET_NAME=${{ matrix.target_name }}
            fi   
          
          # Inject into BOTH the binary output and the test project root
          cp "$LIB_FILE" "$FULL_DEST$TARGET_NAME"
          cp "$LIB_FILE" "${{ env.DOTNET_TEST_DIR }}/$TARGET_NAME"

      # ======================================================
      # 5. TEST EXECUTION WITH PATH HOISTING
      # ======================================================
      
      - name: Run Integration Tests
        working-directory: ${{ env.DOTNET_TEST_DIR }}
        shell: bash # Standardizing to bash makes path manipulation easier
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ runner.os == 'Linux' && 'http://localhost:4317' || 'http://localhost:9999' }}
          OTEL_SERVICE_NAME: "CaseConversion-Test-Runner"
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            export PATH="$PATH:$(pwd)"
          fi
          dotnet test --no-build --configuration Release --verbosity normal