name: C++ Quality Guard

on:
  push:
    branches: ["main"]
    paths: &shared_paths
      - 'backend/CaseConversionAPI/CppLib/**'
      - '.github/workflows/cpp-quality-guard.yml'
  pull_request:
    branches: ["main"]
    paths: *shared_paths
  workflow_dispatch: {}

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Install deterministic LLVM toolchain (Clang 16)
      # ------------------------------------------------------------

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-16 clang-tidy-16 cmake jq

      # ------------------------------------------------------------
      # Execution & Structured Logging
      # ------------------------------------------------------------
        
      - name: Run Analysis with Logging
        working-directory: backend/CaseConversionAPI/CppLib
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"
          
          log_event() {
            local level=$1
            local component=$2
            local message=$3
            jq -n \
              --arg ts "$TIMESTAMP" \
              --arg repo "$REPO" \
              --arg lvl "$level" \
              --arg comp "$component" \
              --arg msg "$message" \
              '{timestamp: $ts, repository: $repo, level: $lvl, component: $comp, message: $msg}' -c
          }

          # Step 1: Configure
          log_event "INFO" "CMake" "Starting configuration with CMAKE_EXPORT_COMPILE_COMMANDS=ON"
          cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON || { log_event "ERROR" "CMake" "Configuration failed"; exit 1; }

          # Step 2: Clang-Format
          log_event "INFO" "Clang-Format" "Initiating strict format check on src/"
          if ! find src -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) -print0 | xargs -0 clang-format-16 --dry-run --Werror; then
            log_event "ERROR" "Clang-Format" "Styling violations detected"
            exit 1
          fi

          # Step 3: Clang-Tidy
          log_event "INFO" "Clang-Tidy" "Starting deep static analysis for memory safety"
          if ! find src -name "*.cpp" -print0 | xargs -0 clang-tidy-16 -p build --header-filter=src/.* --warnings-as-errors=*; then
            log_event "ERROR" "Clang-Tidy" "Code smells or memory safety issues detected"
            exit 1
          fi

          log_event "INFO" "Quality-Guard" "All static analysis checks passed successfully"