#*********************************************************************/
#  CI Maintenance - GitHub Cache Cleanup                             */
#                                                                    */
# Purpose   : Automatically removes stale GitHub Actions caches      */
#             to prevent storage limit exhaustion (10GB cap).        */
#                                                                    */
# Trigger   : Scheduled (Daily) + Manual Invocation                  */
# Runtime   : Ubuntu Latest                                          */
#                                                                    */
# Notes     : - Uses GitHub CLI cache extension.                     */
#             - Deletes caches older than 7 days.                    */
#             - Prevents cache explosion from dynamic keys.          */
#                                                                    */
# Revision History:                                                  */
# ------------------------------------------------------------------ */
# Version    Date        Author          Description                 */
# ------------------------------------------------------------------ */
# 1.0        2026-05-03  Nitish Singh    Initial Cache Cleanup Job   */
#*********************************************************************/

name: Cache Cleanup

on:
  schedule:
    - cron: '30 18 * * *' # Midnight IST (18:30 UTC)
  workflow_dispatch: {}

permissions:
  actions: write    
  contents: read  

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Install Cache Extension
        run: |
          gh extension install actions/gh-actions-cache

      - name: Delete Old Caches
        run: |
          REPO=${{ github.repository }}
          echo "Fetching cache list for $REPO..."
          
          gh actions-cache list -R $REPO --limit 100 > caches.txt

          while read -r line; do
            KEY=$(echo $line | awk '{print $1}')
            LAST_USED=$(echo $line | awk '{print $3" "$4}')

            LAST_USED_TS=$(date -d "$LAST_USED" +%s || echo 0)
            NOW_TS=$(date +%s)
            AGE=$(( (NOW_TS - LAST_USED_TS) / 86400 ))

            if [ "$AGE" -gt 7 ]; then
              echo "Deleting stale cache: $KEY (Age: $AGE days)"
              gh actions-cache delete "$KEY" -R $REPO --confirm
            else
              echo "Skipping active cache: $KEY (Age: $AGE days)"
            fi
          done < caches.txt
