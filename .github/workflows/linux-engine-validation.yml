name: "Linux Engine Validation"

on:
  push:
    branches: ["main"]
    paths: &shared_paths
      - 'Backend/CaseConversionAPI/CppLib/**'
      - '.github/workflows/linux-engine-validation.yml'
  pull_request:
    branches: ["main"]
    paths: *shared_paths

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # ------------------------------------------------------------
      # 1. REPOSITORY & ENVIRONMENT PREPARATION
      # ------------------------------------------------------------
      # ------------------------------------------------------------
      
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Structured Logging
      # ------------------------------------------------------------

      - name: Initialize Workflow Logs
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          log_event() {
            jq -n \
              --arg ts "$TIMESTAMP" \
              --arg lvl "$1" \
              --arg msg "$2" \
              '{timestamp: $ts, component: "linux-validator", level: $lvl, message: $msg}' -c
          }
          log_event "INFO" "Starting native engine validation suite"

      - name: Create marker file
        run: touch marker_file.txt

      - name: Install Toolchain
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake

      - name: Show directory structure
        run: ls -R

      # ------------------------------------------------------------
      # ------------------------------------------------------------
      # 2. ARCHITECTURAL CONFIGURATION (Updated Paths)
      # ------------------------------------------------------------
      # ------------------------------------------------------------

      - name: Use local app CMakeLists
        # TRICK: Swap the default CMakeLists with a specialized version 
        # for local/standalone app building. This allows us to build 
        # a testable executable without modifying the core API build logic.
        run: |
          cp Backend/CaseConversionAPI/CppLib/CMakeListsLocalApp.txt \
             Backend/CaseConversionAPI/CppLib/CMakeLists.txt
          echo "{\"event\": \"CONFIG_SWAP\", \"status\": \"SUCCESS\", \"target\": \"LocalApp\"}"

      - name: Configure String Conversion
        run: |
          cmake -S Backend/CaseConversionAPI/CppLib \
                -B Backend/CaseConversionAPI/CppLib/build \
                -DCMAKE_BUILD_TYPE=Release
      
      # ------------------------------------------------------------
      # 3. Compilation & Runtime Validation
      # ------------------------------------------------------------
      # ------------------------------------------------------------
      # 3. Compilation & Runtime Validation
      # ------------------------------------------------------------

      - name: Build project
        run: cmake --build Backend/CaseConversionAPI/CppLib/build --parallel

      - name: Run String Conversion App
        run: |
          ./Backend/CaseConversionAPI/CppLib/build/app
          echo "{\"event\": \"RUNTIME_EXECUTION\", \"binary\": \"app\", \"status\": \"PASSED\"}"

      # ------------------------------------------------------------
      # 4. NATIVE TEST EXECUTION (GOOGLE TEST)
      # ------------------------------------------------------------

      # ------------------------------------------------------------
      # 4. NATIVE TEST EXECUTION (GOOGLE TEST)
      # ------------------------------------------------------------

      - name: Run String Conversion Tests with Logs
        run: ./Backend/CaseConversionAPI/CppLib/build/runTests --gtest_output=console --gtest_brief=0


      - name: Finalize Status
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg st "${{ job.status }}" \
            '{timestamp: $ts, event: "ENGINE_VALIDATION_COMPLETE", status: $st}' -c


      - name: Finalize Status
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg st "${{ job.status }}" \
            '{timestamp: $ts, event: "ENGINE_VALIDATION_COMPLETE", status: $st}' -c