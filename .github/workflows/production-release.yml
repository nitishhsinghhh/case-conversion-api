name: "Production Release"

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: "Build Assets & Create Release"
    runs-on: macos-latest
    permissions:
      contents: write
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Hardware Context
      # ------------------------------------------------------------
        
      - name: Initialize Workflow Logs
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"PROD_BUILD_INIT\", \"target\": \"ARM64_M2\"}"

      # ------------------------------------------------------------
      # Native Layer: C++17 Engine (Apple Silicon Optimization)
      # ------------------------------------------------------------

      - name: "Build Native Engine"
        run: |
          cmake -S Backend/CaseConversionAPI/CppLib -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # Managed Layer: .NET 8 API & ABI Synchronization
      # ------------------------------------------------------------

      - name: "Publish API"
        run: |
          dotnet publish Backend/CaseConversionAPI/DotNetAPI/DotNetAPI.csproj \
                 -c Release -o ./publish
          
          DYLIB_PATH=$(find build -name "libProcessStringDLL.dylib" | head -n 1)
          
          if [ -z "$DYLIB_PATH" ]; then
            echo "{\"event\": \"ABI_SYNC_FAILURE\", \"reason\": \"dylib_not_found\"}"
            exit 1
          fi
          
          cp "$DYLIB_PATH" ./publish/
          echo "{\"event\": \"ABI_SYNC_SUCCESS\", \"lib\": \"libProcessStringDLL.dylib\"}"

      # ------------------------------------------------------------
      # Packaging & Distribution
      # ------------------------------------------------------------

      - name: "Package Assets"
        run: |
          zip -rj WordCaseEngine-ARM64.zip ./publish
          
          if [ -d "Backend/CaseConversionAPI/Database" ]; then
            zip -r SourceCode-Metadata.zip Backend/CaseConversionAPI/Database README.md
          else
            zip -r SourceCode-Metadata.zip README.md
          fi

      - name: "Release to GitHub"
        uses: softprops/action-gh-release@v1
        with:
          files: |
            WordCaseEngine-ARM64.zip
            SourceCode-Metadata.zip
          body: |
            ## Word Case Conversion Engine v3.2.0

            This release formalizes the production-grade deployment layout, focusing on high-throughput execution density, hardware-aligned memory guards, and cross-boundary interop stability.

            ### Core Additions: Managed Spellcheck Service
            - **Dynamic Engine Interop:** Fully integrated `ManagedSpellCheckService` utilizing runtime OS-specific binary module resolution (`.dll` / `.so` / `.dylib`).
            - **Defensive ABI Boundaries:** Implemented explicit `IntPtr` memory layouts and double-indirection pointer tracking (`ref IntPtr`) to guarantee faultless register execution on ARM64 calling topologies.
            - **Deterministic Memory Sovereignty:** Enforced zero-leak operational metrics with complete RAII compliance and unmanaged allocations isolated within protected `finally` execution blocks.
            - **Distributed Observability:** Embedded standard `ActivitySource` telemetry hooks to capture cross-boundary execution latency.

            **Installation:**
            1. Extract `WordCaseEngine-ARM64.zip`.
            2. Native binaries are pre-linked—no external C++ dependencies required.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize Status
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"RELEASE_COMPLETE\", \"status\": \"${{ job.status }}\"}"