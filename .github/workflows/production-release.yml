name: "Production Release"

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: "Build Assets & Create Release"
    runs-on: macos-latest
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Hardware Context
      # ------------------------------------------------------------
        
      - name: Initialize Workflow Logs
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"PROD_BUILD_INIT\", \"target\": \"ARM64_M2\"}"

      # ------------------------------------------------------------
      # Native Layer: C++17 Engine (Apple Silicon Optimization)
      # ------------------------------------------------------------

      - name: "Build Native Engine"
        run: |
          cmake -S Backend/CaseConversionAPI/CppLib -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=arm64
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # Managed Layer: .NET 8 API & ABI Synchronization
      # ------------------------------------------------------------

      - name: "Publish API"
        run: |
          dotnet publish Backend/CaseConversionAPI/DotNetAPI/DotNetAPI.csproj \
                 -c Release -o ./publish
          
          DYLIB_PATH=$(find build -name "libProcessStringDLL.dylib" | head -n 1)
          
          if [ -z "$DYLIB_PATH" ]; then
            echo "{\"event\": \"ABI_SYNC_FAILURE\", \"reason\": \"dylib_not_found\"}"
            exit 1
          fi
          
          cp "$DYLIB_PATH" ./publish/
          echo "{\"event\": \"ABI_SYNC_SUCCESS\", \"lib\": \"libProcessStringDLL.dylib\"}"

       # ------------------------------------------------------------
      # Packaging & Distribution
      # ------------------------------------------------------------

      - name: "Package Assets"
        run: |
          zip -rj WordCaseEngine-ARM64.zip ./publish
          
          if [ -d "Backend/CaseConversionAPI/Database" ]; then
            zip -r SourceCode-Metadata.zip Backend/CaseConversionAPI/Database README.md
          else
            zip -r SourceCode-Metadata.zip README.md
          fi

      - name: "Release to GitHub"
        uses: softprops/action-gh-release@v1
        with:
          files: |
            WordCaseEngine-ARM64.zip
            SourceCode-Metadata.zip
          body: |
            ## Word Case Conversion Engine v4.0.0

            This release extends the platform's deployment and distribution capabilities through automated container publishing, improved release orchestration, and enhanced cross-platform delivery workflows.

            ### Core Additions: GitHub Container Registry Publishing

            * **Automated Container Publishing:** Integrated GitHub Container Registry (GHCR) distribution directly into the CI/CD pipeline for immutable container delivery.
            * **Versioned Image Distribution:** Container images are automatically published using semantic version tags and rolling `latest` references.
            * **Release Traceability:** Established alignment between Git tags, GitHub Releases, container images, and deployment artifacts.
            * **Cross-Platform Artifact Synchronization:** Improved coordination between native C++ binaries and managed .NET runtime packaging workflows.
            * **CI/CD Hardening:** Enhanced build reliability, artifact lifecycle management, and deployment reproducibility through standardized release automation.

            ### Container Distribution

            ```bash
            docker pull ghcr.io/nitishhsinghhh/case-conversion-api:v4.0.0
            ```

            Or use the rolling release:

            ```bash
            docker pull ghcr.io/nitishhsinghhh/case-conversion-api:latest
            ```

            ### Installation

            1. Extract `WordCaseEngine-ARM64.zip`.
            2. Native binaries are pre-linked and bundled with the managed runtime.
            3. No external C++ runtime installation is required.
            4. For containerized deployments, pull the corresponding GHCR image and run using Docker.

            ### Engineering Focus

            This release emphasizes deployment portability, container-based distribution, release automation, and operational consistency while preserving the platform's native-performance architecture and deterministic interoperability model.

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize Status
        if: always()
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"RELEASE_COMPLETE\", \"status\": \"${{ job.status }}\"}"