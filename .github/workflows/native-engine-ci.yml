name: C++ CI CaseConversionAPI - All Platforms (Local App)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Toolchain Setup
      # ------------------------------------------------------------

      - name: Initialize Workflow Logs
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"OS_VALIDATION_START\", \"os\": \"${{ matrix.os }}\"}"

      - name: Install compiler & CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake jq

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake ninja --installargs 'ADD_CMAKE_TO_PATH=System' --yes

      # ------------------------------------------------------------
      # Pre-Build Orchestration
      # ------------------------------------------------------------

      - name: Clean build directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "backend/CaseConversionAPI/CppLib/build") {
            Remove-Item -Recurse -Force "backend/CaseConversionAPI/CppLib/build"
          }

      - name: Use local app CMakeLists
        shell: bash
        run: |
          cp backend/CaseConversionAPI/CppLib/CMakeListsLocalApp.txt \
             backend/CaseConversionAPI/CppLib/CMakeLists.txt
          echo "{\"event\": \"CLI_CONFIG_SWAP\", \"status\": \"SUCCESS\"}"

      # ------------------------------------------------------------
      # Compilation Layer (Release Matrix)
      # ------------------------------------------------------------

      - name: Configure project
        run: cmake -S backend/CaseConversionAPI/CppLib -B backend/CaseConversionAPI/CppLib/build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build backend/CaseConversionAPI/CppLib/build --config Release --parallel

      # ------------------------------------------------------------
      # Execution & CLI Validation
      # ------------------------------------------------------------

      - name: Run app (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./backend/CaseConversionAPI/CppLib/build/app

      - name: Run app (Windows)
        if: runner.os == 'Windows'
        run: ./backend/CaseConversionAPI/CppLib/build/Release/app.exe

      # ------------------------------------------------------------
      # Test Suite (CTest / GoogleTest)
      # ------------------------------------------------------------

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --verbose --test-dir backend/CaseConversionAPI/CppLib/build

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ctest -C Release --verbose --output-on-failure --test-dir backend/CaseConversionAPI/CppLib/build

      # ------------------------------------------------------------
      # Post-Execution Governance
      # ------------------------------------------------------------
        
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: backend/CaseConversionAPI/CppLib/build/Testing/Temporary/LastTest.log

      - name: Finalize Status
        if: always()
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"OS_VALIDATION_COMPLETE\", \"status\": \"${{ job.status }}\"}"