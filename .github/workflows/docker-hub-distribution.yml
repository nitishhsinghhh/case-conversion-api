name: "Docker Hub Distribution"

on:
  push:
    branches: ["main"]
    paths: &shared_paths
      - "Backend/**"
      - "Frontend/**"
      - ".github/workflows/docker-hub-distribution.yml"
  pull_request:
    branches: ["main"]
    paths: *shared_paths

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Structured Logging
      # ------------------------------------------------------------

      - name: Initialize Workflow Logs
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="${{ github.repository }}"
          
          log_event() {
            local level=$1
            local stage=$2
            local message=$3
            jq -n \
              --arg ts "$TIMESTAMP" \
              --arg repo "$REPO" \
              --arg lvl "$level" \
              --arg stg "$stage" \
              --arg msg "$message" \
              '{timestamp: $ts, repository: $repo, level: $lvl, stage: $stg, message: $msg}' -c
          }
          
          log_event "INFO" "INIT" "Starting Docker Distribution Pipeline for $REPO"

      # ------------------------------------------------------------
      # Metadata Extraction & Builder Setup
      # ------------------------------------------------------------

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            nitishhsinghhh/word-case-api
            nitishhsinghhh/word-case-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------------
      # Registry Authentication (Conditional)
      # ------------------------------------------------------------

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------------------------------------------
      # Backend Compilation & Layer Distribution
      # ------------------------------------------------------------

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: ./Backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            nitishhsinghhh/word-case-api:latest
            nitishhsinghhh/word-case-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ------------------------------------------------------------
      # Frontend Compilation & Layer Distribution
      # ------------------------------------------------------------

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            nitishhsinghhh/word-case-ui:latest
            nitishhsinghhh/word-case-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ------------------------------------------------------------
      # Final Status Reporting
      # ------------------------------------------------------------

      - name: Finalize Logs
        if: always()
        run: |
          STATUS="${{ job.status }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg ts "$TIMESTAMP" \
            --arg st "$STATUS" \
            '{timestamp: $ts, event: "WORKFLOW_COMPLETE", status: $st, engine: "docker-buildx"}' -c