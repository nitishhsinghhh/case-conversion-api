#**********************************************************************/
#  CI Pipeline - Docker Orchestration & Image Distribution            */
#                                                                     */
# Purpose   : Packages the CaseConversionAPI ecosystem into           */
#             separate Backend and Frontend images for DockerHub.     */
# Trigger   : Push to main / Pull Request to main                     */
# Runtime   : Ubuntu Latest                                           */
#                                                                     */
# Notes     : - Builds Backend from /backend/Dockerfile.              */
#             - Builds Frontend from /frontend/Dockerfile.            */
#             - v1.2 adds GHA Caching and Buildx for speed.           */
#                                                                     */
# Revision History:                                                   */
# ------------------------------------------------------------------  */
# Version    Date        Author          Description                  */
# ------------------------------------------------------------------  */
# 1.0        2026-04-14  Nitish Singh    Initial Docker Hub Workflow  */
# 1.1        2026-04-15  Nitish Singh    Updated for Monorepo Paths   */
# 1.2        2026-04-24  Nitish Singh    Standardized Header & Naming */
# 1.3        2026-05-01  Nitish Singh    Added PR safety & name sync  */
# 1.4        2026-05-07  Nitish Singh    Added Parallel Build Matrix  */
#**********************************************************************/

name: "Docker Hub Distribution"

on:
  push:
    branches: ["main"]
    # Only trigger on changes to backend, frontend, 
    # or this workflow file to avoid unnecessary builds
    paths: &shared_paths
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-hub-distribution.yml"
  pull_request:
    branches: ["main"]
    paths: *shared_paths

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Needed for PR checks and status updates

    steps:
      # ======================================================
      # 1. WORKSPACE PREPARATION
      # ======================================================
      
      - name: Checkout repo
        uses: actions/checkout@v4

      # Generates metadata (Tags/Labels) based on Git state
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            nitishhsinghhh/word-case-api
            nitishhsinghhh/word-case-ui
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short

      # ======================================================
      # 2. VIRTUALIZED BUILDER SETUP
      # ======================================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================================
      # 3. REGISTRY AUTHENTICATION
      # ======================================================

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ======================================================
      # 4. BACKEND: COMPILATION & DISTRIBUTION
      # ======================================================

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          # Change context to root (.) so paths like 'backend/CaseConversionAPI' work
          context: . 
          file: ./backend/Dockerfile
          # PUSH: True only on main, False on PRs to avoid 401 errors
          push: ${{ github.event_name != 'pull_request' }}
          # Uses the automated metadata for cleaner tagging
          tags: |
            nitishhsinghhh/word-case-api:latest
            nitishhsinghhh/word-case-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Generates security attestation
          provenance: true
          sbom: true

      # ======================================================
      # 5. FRONTEND: COMPILATION & DISTRIBUTION
      # ======================================================

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            nitishhsinghhh/word-case-ui:latest
            nitishhsinghhh/word-case-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
