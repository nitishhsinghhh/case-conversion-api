name: "Security Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 23 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
          - language: csharp
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Logging
      # ------------------------------------------------------------
        
      - name: Initialize Security Audit Logs
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"SAST_SCAN_INIT\", \"lang\": \"${{ matrix.language }}\"}"

      - name: Install compiler & CMake (Linux)
        if: matrix.language == 'c-cpp'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake jq

      # ------------------------------------------------------------
      # CodeQL Engine Initialization
      # ------------------------------------------------------------

      - name: Initialize CodeQL Engine
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      # ------------------------------------------------------------
      # Compilation Layer (Manual Build for Native Interop)
      # ------------------------------------------------------------

      - name: Run Manual Build (C++ Native Engine)
        if: matrix.build-mode == 'manual' && matrix.language == 'c-cpp'
        shell: bash
        run: |
          echo "{\"event\": \"SEMANTIC_BUILD_START\", \"path\": \"Backend/CaseConversionAPI/CppLib\"}"
          cd Backend/CaseConversionAPI/CppLib
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel

      # ------------------------------------------------------------
      # Semantic Analysis & SARIF Generation
      # ------------------------------------------------------------

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

      - name: Finalize Status
        if: always()
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"SAST_SCAN_COMPLETE\", \"status\": \"${{ job.status }}\"}"