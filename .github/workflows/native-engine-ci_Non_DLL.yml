name: C++ CI CaseConversionAPI - All Platforms (Local App)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      BUILD_DIR: backend/CaseConversionAPI/CppLib/build
      CPP_ROOT: backend/CaseConversionAPI/CppLib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Resource Initialization & Toolchain Setup
      # ------------------------------------------------------------
      - name: Initialize Workflow Logs
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"MATRIX_INIT\", \"os\": \"${{ matrix.os }}\"}"

      - name: Install compiler & CMake (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake jq

      - name: Install CMake (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: Install CMake (Windows)
        if: runner.os == 'Windows'
        run: choco install cmake ninja --installargs 'ADD_CMAKE_TO_PATH=System' --yes

      # ------------------------------------------------------------
      # Workspace Cleanup & Config Injection
      # ------------------------------------------------------------
      - name: Clean build directory (Non-Windows)
        if: runner.os != 'Windows'
        run: rm -rf ${{ env.BUILD_DIR }}

      - name: Clean build directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "$env:BUILD_DIR") {
            Remove-Item -Recurse -Force "$env:BUILD_DIR"
          }

      - name: Use local app CMakeLists
        shell: bash
        run: |
          cp ${{ env.CPP_ROOT }}/CMakeListsLocalApp.txt ${{ env.CPP_ROOT }}/CMakeLists.txt
          echo "{\"event\": \"LAPP_CONFIG_INJECTION\", \"status\": \"COMPLETE\"}"

      # ------------------------------------------------------------
      # Build Orchestration (Release Config)
      # ------------------------------------------------------------
      - name: Configure (Non-Windows)
        if: runner.os != 'Windows'
        run: cmake -S ${{ env.CPP_ROOT }} -B ${{ env.BUILD_DIR }} -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S ${{ env.CPP_ROOT }} -B ${{ env.BUILD_DIR }} -G "Visual Studio 17 2022" -A x64

      - name: Build project
        run: cmake --build ${{ env.BUILD_DIR }} --config Release --parallel

      # ------------------------------------------------------------
      # Native Test Execution (CTEST Matrix)
      # ------------------------------------------------------------
      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest -V --output-on-failure --test-dir ${{ env.BUILD_DIR }}

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ctest -C Release -V --output-on-failure --test-dir ${{ env.BUILD_DIR }}

      # ------------------------------------------------------------
      # Post-Execution Artifacts
      # ------------------------------------------------------------
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}
          path: ${{ env.BUILD_DIR }}/Testing/Temporary/LastTest.log

      - name: Finalize Status
        if: always()
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "{\"timestamp\": \"$TIMESTAMP\", \"event\": \"MATRIX_COMPLETE\", \"status\": \"${{ job.status }}\"}"