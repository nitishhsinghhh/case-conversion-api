# DESCRIPTION : Orchestrates a multi-OS build and test matrix for    */
#               the CaseConversionAPI C++17 core. Validates ABI      */
#               stability across Ubuntu, Windows, and macOS.         */
#                                                                    */
# SIDE EFFECTS: Cleans build workspaces per platform. Injects        */
#               specialized CMake configurations for standalone app  */
#               verification.                                        */
